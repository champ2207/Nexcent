<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- header section-->
    <header class="header-section">
        <nav class="header-nav">
            <img class="header-logo" src="imgs/headerlogo.svg" alt="logo">
            <ul class="nav-links">
                <li class="nav-link" href="#">Home</li>
                <li class="nav-link" href="#">Service</li>
                <li class="nav-link" href="#">Feature</li>
                <li class="nav-link" href="#">Product</li>
                <li class="nav-link" href="#">Testimonial</li>
                <li class="nav-link" href="#">FAQ</li>
            </ul>
            <div class="register">
                <button class="login-btn">Login</button>
                <button class="signup-btn">Sign up</button>
            </div>
        </nav>
    </header>
    <!-- /header section-->

    <!-- hero section-->
    <section class="hero-section">
        <div class="hero-text">
            <h2>Lessons and insights <span class="highlight" style="color: #4CAF4F;"> <br>from 8 years</span></h2>
            <p>Where to grow your business as a photographer: site or social media?</p>
            <button class="hero-btn">Register</button>
        </div>
        <img class="hero-img" src="imgs/Illustration.png" alt="">
        
    </section>
    <img class="nuqta" src="imgs/Dot.png" alt="">

</html>
